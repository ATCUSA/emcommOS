name: setup-build-host
description: Install podman (and optionally nfpm, sha256-pinned) on an Ubuntu runner
inputs:
  nfpm:
    description: Install nfpm
    default: "true"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INSTALL_NFPM: ${{ inputs.nfpm }}
      run: |
        set -euo pipefail
        command -v podman >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq podman; }
        podman --version
        [ "$INSTALL_NFPM" = "true" ] || exit 0
        # Keep in step with the nfpm in flake.nix/flake.lock (nixpkgs nixos-26.05 → 2.46.3):
        # bump both together. Sums are from the release's official checksums.txt.
        NFPM_VERSION=2.46.3
        case "$(uname -m)" in
          x86_64) a=x86_64; sum=9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565 ;;
          aarch64) a=arm64; sum=7871d72bb1035924eab56031f962ae3f004b1f7695151789ef018bdbc507a2fa ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        tgz="$RUNNER_TEMP/nfpm.tar.gz"
        curl -fsSL -o "$tgz" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${a}.tar.gz"
        echo "${sum}  ${tgz}" | sha256sum -c -
        sudo tar -xzf "$tgz" -C /usr/local/bin nfpm
        rm -f "$tgz"
        nfpm --version
