name: packages
on:
  push:
    branches: [main]
    paths: [recipes/**, tools/**, cli/**, radios/**, ansible/**, keys/**, targets.yaml, bootstrap.sh]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every package even if already published
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [debian-13, fedora-44, fedora-43]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      # May be empty: build then treats nothing as published and builds everything.
      EMCOMM_REPO_URL: ${{ vars.EMCOMM_REPO_URL }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: ./.github/actions/setup-build-host
      - name: Build
        run: |
          set -euo pipefail
          # FORCE is intentionally unquoted: empty means no argument.
          # shellcheck disable=SC2086
          uv run --directory tools emcomm-build build \
            --target "$TARGET" --arch "$ARCH" \
            --repo-url "$EMCOMM_REPO_URL" \
            --out "$GITHUB_WORKSPACE/dist/$TARGET/$ARCH" \
            $FORCE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkgs-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: ignore

  # Publishing is restricted to main. Recommended follow-up for the maintainer: put
  # publish behind a GitHub Environment with a main-only deployment branch rule and
  # move the R2 and signing secrets into that environment.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish-testing
      cancel-in-progress: false
    env:
      BUCKET: ${{ vars.R2_BUCKET }}
      EMCOMM_REPO_URL: ${{ vars.EMCOMM_REPO_URL }}
    steps:
      - name: Require configuration
        run: |
          [ -n "$EMCOMM_REPO_URL" ] || { echo "::error::GitHub variable EMCOMM_REPO_URL is empty"; exit 1; }
          [ -n "$BUCKET" ] || { echo "::error::GitHub variable R2_BUCKET is empty"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: ./.github/actions/setup-build-host
        with:
          nfpm: "false"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pkgs-*
          path: dist
          merge-multiple: true
      - id: count
        run: echo "n=$(find dist \( -name '*.deb' -o -name '*.rpm' \) 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Fetch current channel tree
        if: steps.count.outputs.n != '0'
        env: &r2
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          BUCKET: ${{ vars.R2_BUCKET }}
        run: mkdir -p public/testing && rclone sync "r2:$BUCKET/testing" public/testing
      - name: Write signing key
        if: steps.count.outputs.n != '0'
        env:
          KEY: ${{ secrets.EMCOMM_SIGNING_KEY }}
          PASS: ${{ secrets.EMCOMM_SIGNING_PASSPHRASE }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/signing.asc"
          printf '%s' "$PASS" > "$RUNNER_TEMP/passphrase"
      - name: Sign and index
        if: steps.count.outputs.n != '0'
        run: >
          uv run --directory tools emcomm-build publish
          --dist "$GITHUB_WORKSPACE/dist" --repo-dir "$GITHUB_WORKSPACE/public/testing"
          --key-file "$RUNNER_TEMP/signing.asc" --passphrase-file "$RUNNER_TEMP/passphrase"
      - name: Upload
        if: steps.count.outputs.n != '0'
        env: *r2
        run: rclone sync public/testing "r2:$BUCKET/testing"
      - name: Upload bootstrap.sh
        env: *r2
        run: rclone copyto bootstrap.sh "r2:$BUCKET/bootstrap.sh"
      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.asc" "$RUNNER_TEMP/passphrase"

  # tests/integration/repo-install.sh is created by Task 27.
  verify:
    needs: publish
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [debian-13, fedora-44, fedora-43]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EMCOMM_REPO_URL: ${{ vars.EMCOMM_REPO_URL }}
      TARGET: ${{ matrix.target }}
    steps:
      - run: '[ -n "$EMCOMM_REPO_URL" ] || { echo "::error::GitHub variable EMCOMM_REPO_URL is empty"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-host
      - run: tests/integration/repo-install.sh "$TARGET" "$EMCOMM_REPO_URL" testing
